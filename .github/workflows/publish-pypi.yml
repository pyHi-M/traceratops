name: Build and publish Python distributions

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag on main (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: infrastructure
          fetch-depth: 0
          persist-credentials: false
      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Require main and the canonical repository for publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != pyHi-M/traceratops ]]; then
            echo "::error::Publication must be dispatched from main in pyHi-M/traceratops"
            exit 1
          fi
      - name: Test release validation
        run: python -m unittest discover -s infrastructure/.github/scripts -p 'test_*.py' -v
      - name: Resolve and validate the existing release tag
        if: github.event_name == 'workflow_dispatch'
        id: release
        working-directory: infrastructure
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/scripts/release.py tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Check out package source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Manual runs build only the resolved tag SHA; PRs validate their merge SHA.
          ref: ${{ steps.release.outputs.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Build wheel from sdist and validate metadata
        run: |
          python -m pip install build twine
          python -m build --outdir "$GITHUB_WORKSPACE/dist" source
          python -m twine check dist/*
      - name: Verify distribution metadata and payloads
        id: distributions
        run: python infrastructure/.github/scripts/release.py distributions --source source --dist dist --github-output "$GITHUB_OUTPUT"
      - name: Install wheel in a clean environment
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install dist/*.whl
          wheel-env/bin/python -m pip check
      - name: Check installed version and console entry points
        env:
          MPLBACKEND: Agg
          EXPECTED_VERSION: ${{ steps.distributions.outputs.version }}
        run: wheel-env/bin/python infrastructure/.github/scripts/release.py installed "$EXPECTED_VERSION"
      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'pyHi-M/traceratops'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/traceratops
    permissions:
      id-token: write
    steps:
      # No source checkout, build commands or dependency installation in this job.
      - name: Download this run's validated distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          skip-existing: false
