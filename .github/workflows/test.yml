name: Python Tests

on:
  push:
    branches:
      - "*" # All branches
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      # Clone the code
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Verify installed dependencies
        run: |
          uv pip check
          uv run --no-project python -c "import traceratops, numpy, scipy, pandas, astropy, matplotlib, sklearn, seaborn, tqdm, PIL; from packaging.version import Version; assert Version(PIL.__version__) >= Version('13.0.0'); print('Pillow', PIL.__version__)"
          uv run --no-project trace_filter --help

      - name: Run tests with pytest
        env:
          MPLBACKEND: Agg
        run: uv run --no-project pytest -vv -s # opt to verbose & print shell output
