{
  "schema_version": "1.0",
  "repository": {
    "url": "https://github.com/pyHi-M/traceratops",
    "branch": "dev",
    "commit": "d767666dfff6be0eca410cca1cc6acc79970140e"
  },
  "format_note": "JSON syntax is intentional YAML 1.2; load with json stdlib or YAML parser. Parser null defaults are distinct from runtime fallback defaults. Infinity is encoded as string inf.",
  "input_schemas": {
    "trace": {
      "formats": [
        ".ecsv",
        ".dat",
        ".4dn",
        ".csv (reader-specific FOF-CT)"
      ],
      "schema": "One row per localization. Standard columns: Spot_ID:string, Trace_ID:string, x/y/z:float, Chrom:string, Chrom_Start/Chrom_End:int, ROI #:int, Mask_id:int, Barcode #:int, label:string. Prefer ECSV; required subsets vary by operation. Coordinate metadata normally xyz_unit=micron.",
      "reference": "docs/source/scripts/data_formats.md"
    },
    "localization": {
      "formats": [
        ".ecsv",
        ".dat (deprecated)",
        ".4dn"
      ],
      "schema": "One detected spot per row: Buid matching trace.Spot_ID, ROI #, CellID #, Barcode #, id, xcentroid/ycentroid/zcentroid, snr, spot_pixel_percentage, skew, patch_size, object_class, mean_intensity (or legacy peak), flux, roundness. QC needs its plotted columns.",
      "reference": "docs/source/scripts/data_formats.md"
    },
    "pwd_stack": {
      "formats": [
        ".npy"
      ],
      "schema": "Float array [N_barcode,N_barcode,N_trace]; distances normally µm, NaNs for absent pairs. Barcode order supplied separately. Not a contact-frequency matrix."
    },
    "barcodes": {
      "formats": [
        "plain whitespace numeric text (.csv or .ecsv suffix accepted by relevant loaders)"
      ],
      "schema": "One integer barcode ID per row, no ECSV YAML header for np.loadtxt consumers; exact order of array axes."
    },
    "bed": {
      "formats": [
        "tab-separated BED, no header"
      ],
      "schema": "chromosome, start, end, integer barcode ID; optional fifth replacement ID only for trace_genomic_coordinates."
    },
    "metadata": {
      "formats": [
        "JSON"
      ],
      "schema": "genome_assembly, experimenter_name, experimenter_contact strings for export."
    },
    "fofct": {
      "formats": [
        "FOF-CT CSV"
      ],
      "schema": "Metadata ##columns line and coordinate columns Spot_ID,Trace_ID,X,Y,Z,Chrom,Chrom_Start,Chrom_End,Extra_Cell_ROI_ID. Import matches BED intervals."
    },
    "mask": {
      "formats": [
        "NPY",
        "TIFF"
      ],
      "schema": "2D image, positive pixel labels select trace rows; x,y divided by pixel size index mask[x,y]."
    },
    "threeway_matrix": {
      "formats": [
        ".npy"
      ],
      "schema": "2D mean frequency matrix excluding anchor; filename encodes anchor_<integer>. Separate numeric barcode mapping required."
    },
    "collection_root": {
      "formats": [
        "directory tree"
      ],
      "schema": "Immediate subdirectories represent collection units; exactly one file matches recursively within each."
    }
  },
  "cli_tools": [
