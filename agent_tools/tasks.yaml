        "Trace length histogram",
        "Rows per Trace_ID"
      ],
      "distinguish_from": [
        "Repeated observations of the same barcode increase row counts without increasing unique counts."
      ],
      "tools": [
        "cli.trace_analyzer"
      ],
      "sequence": []
    },
    {
