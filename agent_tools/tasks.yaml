{
  "schema_version": "1.0",
  "tasks": [
    {
      "id": "dataset_counts",
      "request": "Count unique traces, ROIs and barcode identities in a dataset",
      "preferred_tool": "cli.trace_stats",
      "synonyms": [
        "How many chromatin traces?",
        "Total distinct barcodes in the dataset",
        "Number of ROIs"
      ],
      "distinguish_from": [
        "Counts distinct Barcode # values globally, not unique counts per trace or localization counts."
      ],
      "tools": [
        "cli.trace_stats"
      ],
      "sequence": []
    },
    {
      "id": "unique_barcode_distribution",
      "request": "Plot distribution of unique barcode counts per chromatin trace",
      "preferred_tool": "cli.trace_analyzer",
      "synonyms": [
        "Number of unique barcodes per trace",
        "Distinct barcodes per trace",
        "Barcode coverage distribution",
        "Trace completeness"
      ],
      "distinguish_from": [
        "Trace completeness needs an expected barcode universe; observed unique-count distribution alone is not a normalized completeness fraction.",
        "Do not substitute dataset-wide distinct barcode count, localization counts, duplicate counts, or individual barcode identity frequencies."
      ],
      "tools": [
        "cli.trace_analyzer"
      ],
      "sequence": []
    },
    {
      "id": "localizations_per_trace",
