      "id": "example.trace_splitter",
      "tool_id": "cli.trace_splitter",
      "objective": "Resolve merged or duplicated traces using spatial K-means/HDBSCAN or barcode-aware beam search. Spatial methods select traces above mean radius of gyration plus std_threshold×SD unless --split-all. Beam classification selects one or two polymers and may reject detections or ambiguous traces.",
      "input_requirements": [
        {
          "schema_ref": "trace",
          "role": "analysis input"
        }
      ],
      "setup": "make_inputs.py generates deterministic synthetic tables plus copies the repository small matrix fixture. Import example first executes the cataloged export command to produce export.csv.",
      "argv": [
        "trace_splitter",
        "--input",
        "trace.ecsv",
        "--method",
        "beam",
        "--quiet"
      ],
      "stdin": null,
      "expected_outputs": [
        "trace_split.ecsv",
        "trace_split_diagnostics.ecsv"
      ],
      "success_checks": [
        "Exit code zero",
        "Expected output files exist and are nonempty",
        "Semantic assertions where supported by run_examples.py",
        "Input fixtures unchanged"
      ],
      "limitations": [
        "Default method is kmeans, not beam; source docs recommend beam with likelihood classifier and global nuisance model for barcode-aware resolution.",
        "K-means/HDBSCAN do not discard rows; HDBSCAN noise retains original Trace_ID.",
        "Beam may discard rows or entire ambiguous traces. Confidence is a normalized score gap, not a calibrated probability.",
        "Likelihood doublet posterior and spatial score-gap confidence are distinct.",
        "auto nuisance model can confuse detection-efficiency and off-target heterogeneity; review diagnostic reliability warnings."
      ],
      "verification": {
        "syntax": "verified against actual parser, exact flags without abbreviations",
        "execution": "passed",
        "evidence": "verification.json#example.trace_splitter",
        "date": "2026-11-13"
